<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2B705">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Contech Site Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F2B705'/%3E%3Cpath d='M14 40h22v8H14zM18 30h12v10H18zM30 32l10-10 8 8' stroke='%2317191C' stroke-width='5' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Site log for junior staff: bright, high-contrast (readable in sun), big type, one job per screen,
   numbered steps, error shown right under the field that needs fixing. */
:root{
  --bg:#F4F2ED;--card:#FFFFFF;--ink:#16181B;--ink2:#3D4249;--mute:#6A7079;--line:#E2DDD2;--line2:#CFC8BA;
  --brand:#F2B705;--brand2:#FFF3C4;--brandInk:#16181B;
  --ok:#137A4A;--okbg:#E2F4EA;--warn:#9A5400;--warnbg:#FFEFD2;--bad:#C42B2B;--badbg:#FDE6E4;
  --blue:#1D5FD1;--bluebg:#E5EEFD;--teal:#0E7C86;--tealbg:#DDF3F4;--slate:#4B5563;--slatebg:#ECEEF1;
  --r:18px;--sh:0 1px 2px rgba(22,24,27,.06),0 4px 14px rgba(22,24,27,.06);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brandInk);padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.top .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.iconbtn{width:46px;height:46px;border-radius:14px;border:0;background:rgba(0,0,0,.08);display:grid;place-items:center;flex:none}
.iconbtn svg{width:24px;height:24px}
.ttl{flex:1}
.ttl b{display:block;font-size:1.12rem;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:.8rem;font-weight:600;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;background:rgba(0,0,0,.1);border-radius:12px;padding:3px;flex:none}
.lang button{border:0;background:transparent;border-radius:9px;padding:7px 10px;font-weight:700;font-size:.82rem;min-height:38px}
.lang button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}

.net{display:none;background:var(--ink);color:#fff;text-align:center;font-weight:600;font-size:.9rem;padding:8px 12px}
.net.show{display:block}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 0}

/* cards and headings */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.h{font-size:1.05rem;font-weight:800;margin:4px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.h small{font-weight:600;color:var(--mute);font-size:.85rem}
.sub{color:var(--mute);font-size:.92rem;margin:0}

/* greeting + progress */
.hello{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.hello b{font-size:1.2rem;font-weight:800;display:block;line-height:1.2}
.prog{margin-top:14px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog .big{font-size:1.9rem;font-weight:800;line-height:1}
.prog .big span{font-size:1rem;color:var(--mute);font-weight:600}
.meter{height:14px;background:var(--slatebg);border-radius:10px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#F2B705,#E09B00);border-radius:10px;transition:width .5s}
.meter.full i{background:var(--ok)}

/* action tiles */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.act{border:0;border-radius:var(--r);background:var(--card);box-shadow:var(--sh);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:120px;position:relative}
.act .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.act .ico svg{width:30px;height:30px}
.act b{font-size:1.02rem;font-weight:800;line-height:1.2}
.act small{color:var(--mute);font-size:.82rem;font-weight:500;line-height:1.25}
.act.main{grid-column:1/-1;flex-direction:row;align-items:center;background:var(--ink);color:#fff;min-height:96px}
.act.main .ico{background:var(--brand)}
.act.main small{color:#C9CCD1}
.act.main .go{margin-left:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.y{background:var(--brand2)}.b{background:var(--bluebg);color:var(--blue)}.t{background:var(--tealbg);color:var(--teal)}.r{background:var(--badbg);color:var(--bad)}

/* machine rows */
.list{display:flex;flex-direction:column;gap:10px}
.mrow{width:100%;border:2px solid transparent;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px;display:flex;align-items:center;gap:12px;text-align:left}
.mrow:active{border-color:var(--brand)}
.mic{width:54px;height:54px;border-radius:14px;background:var(--brand2);display:grid;place-items:center;flex:none}
.mic svg{width:34px;height:34px}
.mname{flex:1}
.mname b{display:block;font-weight:800;font-size:1.02rem;line-height:1.25}
.mname small{display:block;color:var(--mute);font-size:.85rem;font-weight:500}
.pill{font-size:.8rem;font-weight:800;border-radius:30px;padding:5px 11px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-pend{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:46px!important}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:24px 8px;font-weight:600}
details.done-list summary{list-style:none;cursor:pointer;font-weight:800;padding:6px 2px 10px;display:flex;justify-content:space-between}
details.done-list summary::-webkit-details-marker{display:none}

/* forms */
.step{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px;scroll-margin-top:90px}
.step.err{box-shadow:0 0 0 3px var(--bad),var(--sh)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sn{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.sn.ok{background:var(--ok)}
.sh b{font-size:1.05rem;font-weight:800;flex:1}
.req{font-size:.72rem;font-weight:800;color:var(--bad);background:var(--badbg);border-radius:20px;padding:3px 9px;text-transform:none}
.opt{font-size:.72rem;font-weight:700;color:var(--mute);background:var(--slatebg);border-radius:20px;padding:3px 9px}
.lbl{display:block;font-weight:700;color:var(--ink2);margin:14px 0 7px;font-size:.95rem}
.lbl:first-child{margin-top:0}
.field{position:relative}
.field input,.field select,.field textarea,input.plain{width:100%;min-height:58px;border:2px solid var(--line2);border-radius:14px;padding:12px 14px;background:#fff;font-size:1.05rem}
.field textarea{min-height:90px;resize:vertical}
.field input.bignum{font-size:1.9rem;font-weight:800;padding-right:70px;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.field .unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--mute);font-size:1rem;pointer-events:none}
.field input:focus,.field select:focus,.field textarea:focus,input.plain:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--brand2)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--bad);background:#FFF8F7}
.emsg{display:none;color:var(--bad);font-weight:700;font-size:.9rem;margin-top:7px;align-items:center;gap:6px}
.emsg.show{display:flex}
.hint{color:var(--mute);font-size:.85rem;margin-top:6px}
::placeholder{color:#B3B0A8;font-weight:500;opacity:1}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.prev{display:flex;justify-content:space-between;align-items:center;background:var(--brand2);border-radius:14px;padding:12px 14px}
.prev span{font-weight:700;color:var(--ink2);font-size:.9rem}
.prev b{font-size:1.5rem;font-weight:800}
.calc{margin-top:10px;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.calc b{font-size:1.45rem;font-weight:800;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}.c-info{background:var(--slatebg);color:var(--ink2)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:56px;border-radius:14px;border:2px solid var(--line2);background:#fff;font-weight:800;font-size:1rem}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cond button{min-height:78px;border-radius:16px;border:2px solid var(--line2);background:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:.98rem}
.cond button i{width:14px;height:14px;border-radius:50%;display:block}
.cond button.on{border-width:3px}
.cond [data-v=W] i{background:var(--ok)}.cond [data-v=W].on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cond [data-v=I] i{background:#A0A6AE}.cond [data-v=I].on{border-color:var(--slate);background:var(--slatebg)}
.cond [data-v=B] i{background:var(--bad)}.cond [data-v=B].on{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.cond [data-v=N] i{background:var(--blue)}.cond [data-v=N].on{border-color:var(--blue);background:var(--bluebg);color:var(--blue)}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photos.one{grid-template-columns:1fr}
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;border:2.5px dashed var(--line2);border-radius:16px;background:#FCFBF8;text-align:center;padding:12px;cursor:pointer;overflow:hidden}
.ph input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ph svg{width:40px;height:40px;color:var(--ink2)}
.ph b{font-size:.92rem;font-weight:800;line-height:1.2}
.ph small{color:var(--mute);font-size:.78rem;font-weight:600}
.ph.has{border-style:solid;border-color:var(--ok);padding:0}
.ph.has img{width:100%;height:150px;object-fit:cover;display:block}
.ph .retake{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-weight:700;font-size:.78rem;border-radius:20px;padding:5px 10px;pointer-events:none}
.ph .tick{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--ok);display:grid;place-items:center;pointer-events:none}
.ph .tick svg{width:18px;height:18px;color:#fff}
.ph.bad{border-color:var(--bad);background:#FFF8F7}
.ph.hidden{display:none}

.mhead{display:flex;align-items:center;gap:14px}
.mhead .mic{width:64px;height:64px}
.mhead .mic svg{width:40px;height:40px}
.mhead b{font-size:1.2rem;font-weight:800;display:block;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:.78rem;font-weight:700;background:var(--slatebg);color:var(--ink2);border-radius:8px;padding:3px 8px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:60px;border-radius:16px;border:0;font-weight:800;font-size:1.12rem;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:24px;height:24px}
.btn.pri{background:var(--ink);color:#fff}
.btn.yel{background:var(--brand);color:var(--ink)}
.btn.sec{background:#fff;border:2px solid var(--line2);color:var(--ink)}
.btn:disabled{opacity:.6}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* done screen */
.done{text-align:center;padding:26px 16px}
.done .ok{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--okbg)}
.done .ok svg{width:58px;height:58px}
.done.q .ok{background:var(--warnbg)}
.done h2{font-size:1.4rem;margin:4px 0 6px;font-weight:800}
.sum{text-align:left;margin-top:14px;border-top:1px solid var(--line)}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.sum span{color:var(--mute);font-weight:600}
.sum b{font-weight:800;text-align:right}

/* people */
.people{display:grid;grid-template-columns:1fr;gap:10px}
.person{display:flex;align-items:center;gap:14px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;text-align:left;font-weight:800;font-size:1.05rem;min-height:70px}
.person .avatar{width:46px;height:46px;font-size:1rem}
.person.on{border-color:var(--ink);background:var(--brand2)}

.banner{display:flex;align-items:center;gap:10px;background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:700;margin-bottom:14px}
.banner button{margin-left:auto;border:0;background:var(--warn);color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;min-height:40px}
.banner.demo{background:var(--bluebg);color:var(--blue)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;font-weight:700;border-radius:14px;padding:12px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--mute);font-weight:700}
.load .spin{width:40px;height:40px;border-color:var(--line);border-top-color:var(--ink)}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:360px){html{font-size:16px}.acts{gap:10px}.act{padding:14px 12px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="iconbtn hide" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="ttl"><b id="ttl">Site log</b><small id="sub"></small></div>
  <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ne">नेपाली</button></div>
</div></header>
<div class="net" id="net"></div>
<main class="wrap" id="app"></main>
<div class="bar hide" id="bar"><div class="in" id="barin"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
{

/* ================= words ================= */

 cond:'Machine condition',W:'Working',I:'Idle',B:'Breakdown',N:'Not at site',idle:'Idle hours',bdh:'Breakdown hours',work:'Work done',workPh:'e.g. Excavation at Ch 2+450 to 2+600',photos:'Photos',mphoto:'Meter photo',fphoto:'Fuel slip photo',tap:'Tap to take photo',retake:'Tap to retake',needed:'Needed',optional:'Optional',ifFuel:'Needed when fuel given',
 fueltype:'Which fuel?',qty:'Litres received',rate:'Rate per litre (Rs.)',supp:'Supplier / pump name',bill:'Bill or challan number',bphoto:'Bill photo',book:'Should be in tank (book)',meas:'Measured in tank now',diff:'Difference',dphoto:'Dip stick / tank photo',whichM:'Which machine?',fault:'What is the problem?',faultPh:'e.g. Hydraulic hose burst, machine stopped',eta:'When will it be repaired?',bdphoto:'Photo of the problem',
 save:'Save',saving:'Sending…',saved:'Saved and sent to office',savedS:'The office can see it now.',queued:'Saved on this phone',queuedS:'No internet. It will send by itself when internet comes back.',next:'Next machine',lhr:'L/hr',home:'Home',

const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function toBS(d) { const s = iso(d); let out = null; for (const y in BS) BS[y].forEach((m, i) => { if (m <= s) out = {y, m: i, d: Math.round((new Date(s) - new Date(m)) / 864e5) + 1} }); return out }
function dateLine(d) { const b = toBS(d), ad = d.toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}); return b ? `${ad} · ${b.d} ${BSM[L][b.m]} ${b.y}` : ad }

    <div class="cond" data-seg="cond">${['W', 'I', 'B', 'N'].map(v => `<button data-v="${v}" class="${F.cond === v ? 'on' : ''}"><i></i>${t(v)}</button>`).join('')}</div>
    <div id="bdhWrap" class="${F.cond === 'B' ? '' : 'hide'}"><label class="lbl" for="bdh">${t('bdh')}</label>${numField('bdh', t('hrs'), F.bdh)}</div>
    <div id="idleWrap" class="${m.meter === 'Hour' && F.cond !== 'N' ? '' : 'hide'}"><label class="lbl" for="idle">${t('idle')} <span class="opt">${t('optional')}</span></label>${numField('idle', t('hrs'), F.idle)}</div></section>
  <section class="step">${stepH(5, t('work'), optT())}<div class="field"><input id="work" type="text" value="${esc(F.work ?? '')}" placeholder="${esc(t('workPh'))}"></div></section>
  <section class="step" id="s_ph">${stepH(6, t('photos'), reqT())}
    <div class="photos">${photoBox('mp', t('mphoto'), t('needed'))}${photoBox('fp', t('fphoto'), t('ifFuel'))}</div>${emsg('ph')}</section>`;
  bar(`<button class="btn pri" id="save">${I.send}${t('save')}</button>`);
  calc();
}

function calc() {
  const m = cur; if (!m || view !== 'log') return;
  const start = (m.last != null && m.last !== '') ? +m.last : parseFloat($('#start')?.value);
  const end = parseFloat($('#end')?.value), fuel = parseFloat($('#fuel')?.value) || 0, u = unitOf(m);
  let h1 = '', h2 = '';
  if (!isNaN(end) && !isNaN(start)) {
    const used = +(end - start).toFixed(1);
    const bad = used < 0 || (m.meter === 'Hour' && used > 24);
    h1 = `<div class="calc ${bad ? 'c-bad' : 'c-info'}"><span>${t('worked')}</span><b class="num">${fmtN(used)} ${u}</b></div>`;
    if (fuel > 0 && used > 0) {
      const eff = m.meter === 'Hour' ? fuel / used : used / fuel, eu = m.meter === 'Hour' ? t('lhr') : t('km') + '/L';
      const hi = m.meter === 'Hour' && m.max && eff > m.max, lo = m.meter !== 'Hour' && m.min && eff < m.min;
      h2 = `<div class="calc ${hi || lo ? 'c-bad' : 'c-ok'}"><span>${t('eff')}: ${hi ? t('high') : lo ? t('low') : t('normal')}</span><b class="num">${eff.toFixed(1)} ${eu}</b></div>`;
    }
  }
  $('#calc1').innerHTML = h1; $('#calc2').innerHTML = h2;
  const fp = $('#box_fp'); if (fp && !F.fp) fp.querySelector('small').textContent = fuel > 0 ? t('needed') : t('ifFuel');
}

function vFuel() {
  F.ft = F.ft || 'Diesel';
  header(t('fuelin'), D.project, true);
  $('#app').innerHTML = `
  <section class="step">${stepH(1, t('fueltype'))}<div class="seg" data-seg="ft"><button data-v="Diesel" class="${F.ft === 'Diesel' ? 'on' : ''}">Diesel</button><button data-v="Petrol" class="${F.ft === 'Petrol' ? 'on' : ''}">Petrol</button></div></section>
  <section class="step">${stepH(2, t('qty'), reqT())}${numField('qty', 'L', F.qty)}
    <label class="lbl" for="rate">${t('rate')} <span class="opt">${t('optional')}</span></label>${numField('rate', 'Rs', F.rate)}<div id="calc3"></div></section>
  <section class="step">${stepH(3, t('supp'), optT())}<div class="field"><input id="supp" type="text" value="${esc(F.supp ?? '')}"></div>
    <label class="lbl" for="bill">${t('bill')}</label><div class="field"><input id="bill" type="text" value="${esc(F.bill ?? '')}"></div></section>
  <section class="step" id="s_ph">${stepH(4, t('bphoto'), reqT())}<div class="photos one">${photoBox('bp', t('bphoto'), t('needed'))}</div>${emsg('ph')}</section>`;
  bar(`<button class="btn pri" id="save">${I.send}${t('save')}</button>`);
  fuelCalc();
}
function fuelCalc() { const el = $('#calc3'); if (!el) return; const q2 = parseFloat($('#qty')?.value), r = parseFloat($('#rate')?.value); el.innerHTML = q2 > 0 && r > 0 ? `<div class="calc c-info"><span>Total</span><b class="num">Rs ${Math.round(q2 * r).toLocaleString('en-IN')}</b></div>` : '' }

function vDip() {
  F.ft = F.ft || 'Diesel';
  header(t('dip'), D.project, true);
  $('#app').innerHTML = `
  <section class="step">${stepH(1, t('fueltype'))}<div class="seg" data-seg="ft"><button data-v="Diesel" class="${F.ft === 'Diesel' ? 'on' : ''}">Diesel</button><button data-v="Petrol" class="${F.ft === 'Petrol' ? 'on' : ''}">Petrol</button></div>
    <div class="prev" style="margin-top:12px"><span>${t('book')}</span><b class="num" id="bookv">${esc(fmtN(+(D.stock[F.ft] ?? 0)))} L</b></div></section>
  <section class="step">${stepH(2, t('meas'), reqT())}${numField('meas', 'L', F.meas)}<div id="dipg"></div></section>
  <section class="step" id="s_ph">${stepH(3, t('dphoto'), reqT())}<div class="photos one">${photoBox('dp', t('dphoto'), t('needed'))}</div>${emsg('ph')}</section>`;
  bar(`<button class="btn pri" id="save">${I.send}${t('save')}</button>`);
  dipCalc();
}
function dipCalc() { const el = $('#dipg'); if (!el) return; const v = $('#meas').value; if (v === '') { el.innerHTML = ''; return } const d = (+v) - (+(D.stock[F.ft] ?? 0)); el.innerHTML = `<div class="calc ${Math.abs(d) > 20 ? 'c-bad' : 'c-ok'}"><span>${t('diff')}</span><b class="num">${d > 0 ? '+' : ''}${d.toFixed(1)} L</b></div>` }

function vBd() {
  header(t('bd'), D.project, true);
  $('#app').innerHTML = `
  <section class="step">${stepH(1, t('whichM'))}<div class="field"><select id="bm">${D.machines.map(m => `<option value="${esc(m.id)}" ${F.bm === m.id ? 'selected' : ''}>${esc(m.name)} – ${esc(m.id)}</option>`).join('')}</select></div></section>
  <section class="step">${stepH(2, t('fault'), reqT())}<div class="field" id="f_fault"><textarea id="fault" placeholder="${esc(t('faultPh'))}">${esc(F.fault ?? '')}</textarea></div>${emsg('fault')}</section>
  <section class="step">${stepH(3, t('eta'), optT())}<div class="field"><input id="eta" type="date" value="${esc(F.eta ?? '')}"></div></section>
  <section class="step">${stepH(4, t('bdphoto'), optT())}<div class="photos one">${photoBox('bdp', t('bdphoto'), t('optional'))}</div></section>`;
  bar(`<button class="btn pri" id="save" style="background:var(--bad)">${I.send}${t('save')}</button>`);
}

function vDone(queued, lines) {
  view = 'done';
  header(queued ? t('queued') : t('saved'), D.project, false);
  $('#app').innerHTML = `<div class="card done ${queued ? 'q' : ''}"><div class="ok">${queued ? I.warn.replace('<svg', '<svg style="color:var(--warn)"') : I.check.replace('<svg', '<svg style="color:var(--ok)"')}</div>
   <h2>${queued ? t('queued') : t('saved')}</h2><p class="sub">${queued ? t('queuedS') : t('savedS')}</p>
   <div class="sum">${(lines || []).map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div></div>`;
  const more = D.machines.filter(m => !loggedToday(m.id)).length;
  bar(`<button class="btn sec" data-go="home">${I.home}${t('home')}</button>${last === 'saveLog' && more ? `<button class="btn yel" data-go="pickM">${t('next')}</button>` : ''}`);
}

const VIEWS = {home: vHome, user: vUser, pickM: vPick, log: vLog, fuelin: vFuel, dip: vDip, bd: vBd};
function go(v, keep) { view = v; if (!keep) F = {}; VIEWS[v](); window.scrollTo(0, 0); netLine() }

/* ================= photos ================= */
function shrink(file) {
  return new Promise((res, rej) => { const img = new Image(), r = new FileReader();
    r.onload = () => { img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.7)) }; img.onerror = rej; img.src = r.result };
    r.onerror = rej; r.readAsDataURL(file) });
}

/* ================= validation + save ================= */
let gps = '';
function grabGps() { try { navigator.geolocation && navigator.geolocation.getCurrentPosition(p => gps = p.coords.latitude.toFixed(5) + ',' + p.coords.longitude.toFixed(5), () => {}, {timeout: 8000, maximumAge: 300000}) } catch (e) {} }
function clearErr() { document.querySelectorAll('.field.bad').forEach(x => x.classList.remove('bad')); document.querySelectorAll('.emsg.show').forEach(x => x.classList.remove('show')); document.querySelectorAll('.step.err,.ph.bad').forEach(x => x.classList.remove('err', 'bad')) }
function flag(id, msg, boxes) {
  const f = $('#f_' + id); if (f) f.classList.add('bad');
  const e = $('#e_' + id); if (e) { e.querySelector('span').textContent = msg; e.classList.add('show') }
  (boxes || []).forEach(b => $('#box_' + b)?.classList.add('bad'));
  const s = (f || e)?.closest('.step'); if (s) s.classList.add('err');
  return s;
}

async function save() {
  if (busy) return; clearErr();
  const num = id => { const el = $('#' + id); return el && el.value !== '' ? parseFloat(el.value) : NaN };
  const errs = []; let fn, rec, lines;
  const base = {by: user(), gps, at: new Date().toISOString()};
  if (view === 'log') {
    const m = cur, hasLast = m.last != null && m.last !== '', start = hasLast ? +m.last : num('start'), end = num('end'), fuel = num('fuel') || 0;
    if (!hasLast && isNaN(start)) errs.push(flag('start', t('req')));
    if (isNaN(end)) errs.push(flag('end', t('req')));
    else if (!isNaN(start) && end < start) errs.push(flag('end', t('endLess') + ' (' + fmtN(start) + ')'));
    else if (m.meter === 'Hour' && !isNaN(start) && end - start > 24) errs.push(flag('end', t('tooMany')));
    if (F.cond === 'B' && !(num('bdh') > 0)) errs.push(flag('bdh', t('req')));
    const miss = []; if (!F.mp) miss.push('mp'); if (fuel > 0 && !F.fp) miss.push('fp');
    if (miss.length) errs.push(flag('ph', t('photoReq') + ': ' + miss.map(x => t(x === 'mp' ? 'mphoto' : 'fphoto')).join(', '), miss));
    if (!errs.length) {
      const d = new Date(); if (F.day === 'yst') d.setDate(d.getDate() - 1);
      fn = 'saveLog'; rec = {...base, date: iso(d), id: m.id, start, end, fuel, idle: num('idle') || '', bdh: num('bdh') || '', cond: ({W: 'Working', I: 'Idle', B: 'Breakdown', N: 'Not at site'})[F.cond], work: $('#work').value.trim(), mp: F.mp, fp: F.fp || ''};
      lines = [[t('whichM'), m.name], [t('reading'), fmtN(start) + ' → ' + fmtN(end) + ' ' + unitOf(m)], [t('worked'), fmtN(end - start) + ' ' + unitOf(m)], [t('fuel'), fuel + ' L'], [t('cond'), t(F.cond)]];
    }
  } else if (view === 'fuelin') {
    const qty = num('qty'), rate = num('rate');
    if (!(qty > 0)) errs.push(flag('qty', t('req')));
    if (!F.bp) errs.push(flag('ph', t('photoReq'), ['bp']));
    if (!errs.length) { fn = 'saveFuel'; rec = {...base, date: iso(new Date()), fuel: F.ft, qty, rate: isNaN(rate) ? '' : rate, supp: $('#supp').value.trim(), bill: $('#bill').value.trim(), bp: F.bp}; lines = [[t('fueltype'), F.ft], [t('qty'), qty + ' L']].concat(rate > 0 ? [[t('rate'), 'Rs ' + rate]] : []) }
  } else if (view === 'dip') {
    const meas = num('meas');
    if (!(meas >= 0)) errs.push(flag('meas', t('req')));
    if (!F.dp) errs.push(flag('ph', t('photoReq'), ['dp']));
    if (!errs.length) { fn = 'saveDip'; rec = {...base, date: iso(new Date()), fuel: F.ft, meas, dp: F.dp}; lines = [[t('fueltype'), F.ft], [t('meas'), meas + ' L'], [t('diff'), ((meas - (+(D.stock[F.ft] ?? 0)))).toFixed(1) + ' L']] }
  } else if (view === 'bd') {
    const fault = $('#fault').value.trim();
    if (!fault) errs.push(flag('fault', t('req')));
    if (!errs.length) { const m = D.machines.find(x => x.id === $('#bm').value); fn = 'saveBreakdown'; rec = {...base, date: iso(new Date()), id: $('#bm').value, fault, eta: $('#eta').value, bdp: F.bdp || ''}; lines = [[t('whichM'), m ? m.name : rec.id], [t('fault'), fault]] }
  }
  if (errs.length) { toast(t('fix')); const s = errs.find(Boolean); if (s) s.scrollIntoView({behavior: 'smooth', block: 'start'}); return }
  busy = true; const b = $('#save'); b.disabled = true; b.innerHTML = `<span class="spin"></span>${t('saving')}`;
  last = fn;
  try {
    await call(fn, rec);
    if (fn === 'saveLog') { D.logged[rec.date + '|' + rec.id] = 1; if (rec.date === iso(new Date())) cur.last = rec.end }
    if (fn === 'saveFuel') D.stock[rec.fuel] = (+(D.stock[rec.fuel] ?? 0)) + rec.qty;
    vDone(false, lines);
  } catch (e) {
    const msg = String(e && e.message || e);
    if (/already|unknown|less than/i.test(msg)) { toast(msg); b.disabled = false; b.innerHTML = `${I.send}${t('save')}` }
    else { const qq = queue(); qq.push({fn, rec}); store.set('cl_queue', qq); if (fn === 'saveLog') D.logged[rec.date + '|' + rec.id] = 1; vDone(true, lines) }
  } finally { busy = false }
}

async function flush(manual) {
  const qq = queue(); if (!qq.length) return; const left = [];
  for (const it of qq) { try { await call(it.fn, it.rec) } catch (e) { if (!/already/i.test(String(e))) left.push(it) } }
  store.set('cl_queue', left);
  if (manual) toast(left.length ? left.length + ' ' + t('waiting') : '✓ ' + t('saved'));
  if (view === 'home') vHome();
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang) { L = b.dataset.lang; store.set('cl_lang', L); return view === 'done' ? go('home') : go(view, true) }
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.m) { cur = D.machines.find(m => m.id === b.dataset.m); F = {}; grabGps(); view = 'log'; vLog(); window.scrollTo(0, 0); return }
  if (b.dataset.user) { store.set('cl_user', b.dataset.user); return go('home') }
  if (b.id === 'othok') { const v = $('#oth').value.trim(); if (v) { store.set('cl_user', v); return go('home') } if (user()) return go('home'); return toast(t('pick')) }
  if (b.dataset.f) { filter = b.dataset.f; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); return drawPick() }
  const s = b.closest('[data-seg]');
  if (s) {
    F[s.dataset.seg] = b.dataset.v; s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    if (s.dataset.seg === 'cond') { $('#bdhWrap').classList.toggle('hide', F.cond !== 'B'); $('#idleWrap').classList.toggle('hide', !(cur.meter === 'Hour' && F.cond !== 'N')) }
    if (s.dataset.seg === 'ft' && view === 'dip') { $('#bookv').textContent = fmtN(+(D.stock[F.ft] ?? 0)) + ' L'; dipCalc() }
    return;
  }
  if (b.id === 'save') return save();
  if (b.id === 'back') { if (view === 'log') return go('pickM'); if (view === 'user' && !user()) return; return go('home') }
  if (b.id === 'who') return go('user');
  if (b.id === 'flush') return flush(true);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (['start', 'end', 'fuel', 'idle', 'bdh', 'work', 'qty', 'rate', 'supp', 'bill', 'meas', 'fault', 'eta'].includes(id)) F[id] = e.target.value;
  if (id === 'q') { q = e.target.value; return drawPick() }
  const f = e.target.closest('.field.bad'); if (f) { f.classList.remove('bad'); $('#e_' + id)?.classList.remove('show'); const s = f.closest('.step'); if (s && !s.querySelector('.field.bad')) s.classList.remove('err') }
  if (view === 'log') calc(); if (view === 'fuelin') fuelCalc(); if (view === 'dip' && id === 'meas') dipCalc();
});
document.addEventListener('change', async e => {
  if (e.target.id === 'bm') F.bm = e.target.value;
  const n = e.target.dataset.ph; if (!n || !e.target.files[0]) return;
  const box = $('#box_' + n);
  try {
    F[n] = await shrink(e.target.files[0]);
    box.classList.remove('bad'); box.classList.add('has');
    box.innerHTML = `<img src="${F[n]}" alt=""><span class="tick">${I.check}</span><span class="retake">${t('retake')}</span><input type="file" accept="image/*" capture="environment" data-ph="${n}">`;
    const em = $('#e_ph'); if (em && !document.querySelector('.ph.bad')) { em.classList.remove('show'); em.closest('.step')?.classList.remove('err') }
  } catch (er) { toast('Photo could not be read – try again') }
});
window.addEventListener('online', () => { netLine(); flush() });
window.addEventListener('offline', netLine);

/* ================= start ================= */
function start() {
  header('Contech Site Log', '', false); bar('');
  $('#app').innerHTML = `<div class="load"><span class="spin"></span>${L === 'ne' ? 'खुल्दैछ…' : 'Opening…'}</div>`;
  call('init').then(d => { D = d; flush(); go(user() ? 'home' : 'user') })
    .catch(e => { $('#app').innerHTML = `<div class="card done q"><div class="ok">${I.warn.replace('<svg', '<svg style="color:var(--warn)"')}</div><h2>${t('loadErr')}</h2><p class="sub">${esc(e && e.message || e)}</p></div>`; bar(`<button class="btn pri" id="retry">${t('retry')}</button>`); $('#retry').onclick = start });
}
start(); netLine();
}
</script>
</body>
</html>
